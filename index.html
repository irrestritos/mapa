 const url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.lat+','+p.lon)+'&travelmode=driving';
 return `<div class="popup-title">${escapeHtml(p.nome)}</div><div class="popup-sub">${escapeHtml(p.cidade)}</div><div class="popup-coord">${fmt(p.lat)}, ${fmt(p.lon)}</div><a class="popup-btn" href="${url}" target="_blank" rel="noopener">Traçar rota no Google Maps ↗</a>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let userMarker=null,userCircle=null,lastPosition=null;
function locate(){
 const status=document.getElementById('status');
 if(!navigator.geolocation){status.textContent='GPS indisponível neste navegador';return;}
 status.textContent='Obtendo GPS…';
 navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude,lon=pos.coords.longitude;lastPosition=[lat,lon];
   if(userMarker)map.removeLayer(userMarker);
   if(userCircle)map.removeLayer(userCircle);
   userMarker=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000})

 },{enableHighAccuracy:true,timeout:20000,maximumAge:10000});
}

document.getElementById('search').addEventListener('input',e=>{
 const q=e.target.value.trim().toLocaleLowerCase('pt-BR');
 clusters.clearLayers();
 const found=markers.filter(m=>!q||(m._local.nome+' '+m._local.cidade).toLocaleLowerCase('pt-BR').includes(q));
 found.forEach(m=>clusters.addLayer(m));

});
